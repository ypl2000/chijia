<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人财务分析与资金计划（通用模板）</title>
<style>
  :root{
    --ink:#1c2333;
    --sub:#5a6478;
    --line:#e6e9f0;
    --bg:#f4f6fa;
    --card:#ffffff;
    --blue:#2f6fed;
    --blue-soft:#e8effd;
    --green:#0f9d6e;
    --green-soft:#e3f5ee;
    --orange:#e8871e;
    --orange-soft:#fdf0df;
    --gray-soft:#eef0f4;
    --red:#d64541;
    --red-soft:#fceceb;
    --gold:#e8a13a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.65;
  }

  /* ===== 悬浮大类导航 ===== */
  .fab{
    position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:80;
    display:flex;flex-direction:column;gap:6px;padding:10px 8px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:16px;
    box-shadow:0 10px 30px rgba(28,35,51,.15);
  }
  .fab .brand{
    text-align:center;font-size:12px;font-weight:800;color:var(--sub);
    padding:0 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px;letter-spacing:2px;
  }
  .fab a{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    width:78px;padding:8px 4px;border-radius:11px;
    text-decoration:none;color:var(--ink);transition:.15s;
  }
  .fab a .ico{
    width:26px;height:26px;border-radius:8px;background:var(--blue-soft);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
  }
  .fab a .lab{font-size:11.5px;line-height:1.2;}
  .fab a:hover{background:var(--blue-soft);}
  .fab a.active{background:var(--blue);color:#fff;}
  .fab a.active .ico{background:rgba(255,255,255,.25);color:#fff;}
  .fab a.top .ico{background:var(--gray-soft);color:var(--sub);}

  /* ===== 正文 ===== */
  .content{max-width:1240px;margin:0 auto;padding:26px clamp(16px,3vw,44px) 60px;}
  @media (max-width:1520px){
    .content{margin:0 20px 0 104px;max-width:none;}
  }

  .hero{
    background:linear-gradient(135deg,#22315c 0%,#2f6fed 100%);
    border-radius:16px;color:#fff;padding:30px 30px 26px;margin-bottom:16px;
  }
  .hero h1{font-size:24px;letter-spacing:.5px;font-weight:700;}
  .hero p.sub{opacity:.85;margin-top:6px;font-size:14px;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .chip{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    border-radius:999px;padding:6px 15px;font-size:13px;
  }
  .chip b{font-size:14.5px;}
  .chip.dim{background:rgba(255,255,255,.08);border-style:dashed;}
  .stat-split{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;gap:0;margin-top:14px;}
  .stat-side{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 16px;}
  .stat-side.now{border-left:4px solid #8fd3ff;}
  .stat-side.exp{border-left:4px solid #ffd58a;}
  .stat-side .ss-head{font-size:12.5px;letter-spacing:.5px;opacity:.85;margin-bottom:8px;font-weight:700;}
  .stat-side .ss-items{display:flex;flex-wrap:wrap;gap:6px 22px;}
  .stat-side .ss-item{display:flex;flex-direction:column;gap:1px;min-width:110px;}
  .stat-side .ss-item span{font-size:12px;opacity:.8;}
  .stat-side .ss-item b{font-size:16px;font-variant-numeric:tabular-nums;}
  .stat-arrow{display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.9;}

  /* ===== Part banner ===== */
  .part{margin:26px 0 14px;display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:10px;}
  .part .no{
    font-size:12.5px;font-weight:700;color:#fff;background:var(--ink);
    border-radius:8px;padding:4px 12px;white-space:nowrap;
  }
  .part h2{font-size:21px;font-weight:800;letter-spacing:1px;}
  .part .pnote{margin-left:auto;color:var(--sub);font-size:12.5px;}

  /* ===== 可折叠卡片 ===== */
  details.sec{
    background:var(--card);border-radius:14px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(28,35,51,.06);overflow:hidden;scroll-margin-top:16px;
  }
  details.sec > summary{
    cursor:pointer;list-style:none;user-select:none;
    display:flex;align-items:center;gap:11px;
    padding:15px 22px;font-size:15.5px;font-weight:700;transition:background .15s;
  }
  details.sec > summary::-webkit-details-marker{display:none;}
  details.sec > summary::before{
    content:"";width:5px;height:17px;border-radius:3px;background:var(--blue);flex:0 0 auto;
  }
  details.sec > summary:hover{background:#f7f9fd;}
  details.sec > summary .chev{
    margin-left:auto;color:var(--sub);font-size:12px;transition:transform .2s;
  }
  details.sec[open] > summary .chev{transform:rotate(180deg);}
  details.sec:not([open]) > summary .chev{transform:rotate(-90deg);}
  .sec-body{padding:2px 24px 24px;}

  /* ===== 嵌套折叠块 ===== */
  details.sub{
    border:1px solid var(--line);border-left:3px solid var(--blue);
    border-radius:10px;background:#fbfcfe;margin:16px 0;
  }
  details.sub > summary{
    cursor:pointer;list-style:none;user-select:none;
    padding:11px 14px;font-size:13.5px;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  details.sub > summary::-webkit-details-marker{display:none;}
  details.sub > summary .chev{margin-left:auto;font-size:11px;color:var(--sub);transition:transform .2s;}
  details.sub[open] > summary .chev{transform:rotate(180deg);}
  details.sub:not([open]) > summary .chev{transform:rotate(-90deg);}
  details.sub > summary:hover{color:var(--blue);}
  .sub-body{padding:2px 16px 16px;}

  .sec-sub{color:var(--sub);font-size:13.5px;margin-bottom:16px;}
  h4{font-size:14px;margin:16px 0 8px;color:var(--ink);font-weight:700;}
  h4 .hint{font-weight:400;color:var(--sub);font-size:12.5px;}

  /* ===== Tables ===== */
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{
    background:#f0f3f9;color:var(--sub);font-weight:600;text-align:left;
    padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;
  }
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  tr.total td{background:#f7f9fd;font-weight:700;}
  .tbl-wrap{overflow-x:auto;}
  tr.hl-green td{background:var(--green-soft);}
  tr.hl-orange td{background:var(--orange-soft);}
  tr.hl-red td{background:var(--red-soft);}
  tr.hl-blue td{background:var(--blue-soft);}
  .tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap;}
  .tag-green{background:var(--green-soft);color:var(--green);}
  .tag-blue{background:var(--blue-soft);color:var(--blue);}
  .tag-orange{background:var(--orange-soft);color:#c06e10;}
  .tag-red{background:var(--red-soft);color:var(--red);}
  .tag-gray{background:var(--gray-soft);color:var(--sub);}
  .muted{color:var(--sub);}
  .done{font-weight:700;color:var(--green);}
  .neg{color:var(--red);font-weight:600;}
  .arw{color:var(--blue);font-weight:800;}

  /* ===== Callout ===== */
  .callout{
    background:var(--blue-soft);border-radius:10px;padding:14px 18px;font-size:13.5px;
    color:#28457e;margin-top:14px;
  }
  .callout b{color:var(--blue);}
  .callout.ok{background:var(--green-soft);color:#14614a;}
  .callout.ok b{color:var(--green);}
  .callout.warn{background:var(--orange-soft);color:#8a5a10;}
  .callout.warn b{color:#c06e10;}

  /* ===== Bullets ===== */
  ul.dotlist{padding-left:0;list-style:none;}
  ul.dotlist li{position:relative;padding-left:20px;margin:7px 0;font-size:14px;}
  ul.dotlist li::before{
    content:"";position:absolute;left:2px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--blue);
  }

  /* ===== 置顶：资金分布对比 ===== */
  .dist-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-top:6px;}
  .dist-card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;}
  .dist-card .dc-head{font-size:13px;color:var(--sub);font-weight:600;}
  .dist-card .dc-total{font-size:20px;font-weight:800;margin:2px 0 12px;}
  .dist-card.now{border-top:4px solid var(--orange);}
  .dist-card.exp{border-top:4px solid var(--green);}
  .dist-arrow{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;min-width:130px;padding:0 4px;
  }
  .dist-arrow .big{font-size:36px;color:var(--blue);font-weight:800;line-height:1;}
  .dist-arrow .cap{
    font-size:12px;color:#28457e;text-align:center;
    background:var(--blue-soft);border-radius:8px;padding:6px 10px;line-height:1.5;
  }
  .dstack{display:flex;border-radius:9px;overflow:hidden;height:26px;margin:6px 0 12px;font-size:11.5px;color:#fff;}
  .dstack div{display:flex;align-items:center;justify-content:center;white-space:nowrap;min-width:0;}
  .drow{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0;}
  .drow .nm{flex:0 0 128px;display:flex;align-items:center;gap:6px;}
  .drow .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;}
  .drow .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .drow .pc2{flex:0 0 52px;text-align:right;color:var(--sub);white-space:nowrap;}
  @media (max-width:860px){
    .dist-grid{grid-template-columns:1fr;}
    .dist-arrow{flex-direction:row;padding:2px 0;}
    .dist-arrow .big{font-size:28px;}
    .dist-arrow .cap{text-align:left;}
  }

  /* ===== 图形化：流程链 ===== */
  .flow{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;}
  .flow .step{
    flex:1;min-width:130px;background:#fbfcfe;border:1px solid var(--line);
    border-radius:12px;padding:12px 10px;text-align:center;
  }
  .flow .step .t{font-size:13.5px;font-weight:700;}
  .flow .step .d{font-size:12px;color:var(--sub);margin-top:3px;}
  .flow .arrow{
    align-self:center;color:var(--blue);font-weight:800;font-size:16px;padding:0 2px;flex:0 0 auto;
  }

  /* ===== 图形化：理财梯队 ===== */
  .tier{display:flex;flex-direction:column;gap:8px;margin:6px 0;}
  .tier .t-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .tier .t-bar{
    height:32px;border-radius:8px;display:flex;align-items:center;
    padding:0 14px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;
  }
  .tier .t-row .tag{margin-left:2px;}

  /* ===== 图形化：资金瀑布 ===== */
  .wf-line{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:8px 2px;}
  .wf-node{
    flex:0 0 auto;min-width:116px;text-align:center;background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:8px 6px;
  }
  .wf-node .d{font-size:11px;color:var(--sub);}
  .wf-node .a{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;}
  .wf-node.in .a{color:var(--green);}
  .wf-node.out .a{color:var(--red);}
  .wf-node.key{border-color:var(--red);background:var(--red-soft);}
  .wf-node.key .a{color:var(--red);}
  .wfa{color:var(--sub);font-size:13px;flex:0 0 auto;padding:0 2px;}

  /* ===== 图形化：画像卡片 ===== */
  .pic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;}
  .pic-card{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fbfcfe;}
  .pic-card .h{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .pic-card .d{font-size:12.5px;color:var(--sub);margin-top:4px;}
  @media (max-width:860px){.pic-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.pic-grid{grid-template-columns:1fr;}}
  .qbar{background:#eef2f8;border-radius:99px;height:10px;overflow:hidden;}
  .qbar i{display:block;height:100%;background:linear-gradient(90deg,#5b8bf0,var(--blue));border-radius:99px;}

  /* ===== 图形化：借贷进度 ===== */
  .loan{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fbfcfe;margin:8px 0;}
  .loan .loan-head{font-size:13.5px;font-weight:700;}
  .loan .loan-head b{color:var(--green);}
  .loan .loan-head .rem{color:var(--red);}
  .loanbar{height:16px;border-radius:8px;background:var(--gray-soft);overflow:hidden;margin:8px 0;}
  .loanbar i{display:block;height:100%;width:80%;background:var(--green);border-radius:8px;}
  .ms{font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px;}
  .ms span{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 9px;}

  /* ===== 图形化：垂直时间线 ===== */
  .tl{position:relative;padding-left:24px;margin:6px 0;}
  .tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line);}
  .tl .tl-item{position:relative;margin:12px 0;}
  .tl .tl-item::before{
    content:"";position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;
    background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 2px var(--blue-soft);
  }
  .tl .t{font-weight:700;font-size:13.5px;}
  .tl .d{font-size:13px;color:var(--sub);}

  /* ===== Allocation bar ===== */
  .allocbar{display:flex;border-radius:10px;overflow:hidden;height:44px;margin:14px 0 10px;font-size:12.5px;color:#fff;}
  .allocbar div{display:flex;align-items:center;justify-content:center;white-space:nowrap;min-width:0;}
  .ab-consume{background:#8a93a8;width:24%;}
  .ab-invest{background:var(--blue);width:24%;}
  .ab-cushion{background:var(--green);width:20%;}
  .ab-esop{background:var(--orange);width:32%;}

  /* ===== 投资分布条 ===== */
  .dist-row2{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px;}
  .dist-row2 .name{flex:0 0 168px;}
  .dist-row2 .bar{flex:1;height:16px;background:var(--gray-soft);border-radius:8px;overflow:hidden;}
  .dist-row2 .bar i{display:block;height:100%;border-radius:8px;min-width:4px;}
  .dist-row2 .pct{flex:0 0 56px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}

  /* ===== Cards ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:6px;}
  .pcard{border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .pcard .lab{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:.3px;}
  .pcard .val{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
  .pcard .note{font-size:12.5px;color:var(--sub);margin-top:4px;}
  .pcard.total{background:#22315c;border:none;color:#fff;}
  .pcard.total .note{color:rgba(255,255,255,.75);}
  .pcard.total .lab{color:#fff;}
  .pcard.total .val{color:#fff;}

  /* ===== Pros / Cons ===== */
  .pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;}
  .pc{border-radius:12px;padding:16px 18px;font-size:13.5px;}
  .pc h4{margin:0 0 8px;font-size:14.5px;}
  .pc ul{padding-left:18px;}
  .pc li{margin:5px 0;}
  .pc.pros{background:var(--green-soft);}
  .pc.pros h4{color:var(--green);}
  .pc.cons{background:var(--red-soft);}
  .pc.cons h4{color:var(--red);}
  @media (max-width:700px){.pc-grid{grid-template-columns:1fr;}}

  /* ===== Stars ===== */
  .stars{color:var(--gold);font-weight:700;letter-spacing:2px;white-space:nowrap;}
  .stars .off{color:#d5dae3;}

  /* ===== Rules ===== */
  .rule{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line);}
  .rule:last-child{border-bottom:none;}
  .rule .no{
    flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  }
  .rule b{display:block;margin-bottom:2px;}
  .rule p{font-size:13.5px;color:var(--sub);}

  /* ===== Part1 双栏：1.1~1.4 左 · 保护规则右 ===== */
  .p1-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;}
  .p1-rules{
    position:sticky;top:18px;background:var(--card);border-radius:14px;
    box-shadow:0 1px 3px rgba(28,35,51,.06);padding:16px 20px 8px;
    border-top:4px solid var(--orange);
  }
  .p1-rules h4{margin:0 0 2px;font-size:15px;}
  .p1-rules .rule p{font-size:13px;line-height:1.65;}
  @media (max-width:1250px){
    .p1-grid{grid-template-columns:1fr;}
    .p1-rules{position:static;}
  }

  footer{
    text-align:center;color:var(--sub);font-size:12px;margin-top:8px;
  }

  /* ===== 响应式 ===== */
  @media (max-width:1150px){
    .fab a .lab{display:none;}
    .fab a{width:42px;padding:7px 0;}
  }
  @media (max-width:700px){
    .fab{
      top:auto;bottom:14px;left:50%;transform:translateX(-50%);
      flex-direction:row;padding:7px 8px;
    }
    .fab .brand{display:none;}
    .content{margin:0;padding:18px 14px 90px;}
    details.sec{scroll-margin-top:14px;}
    .hero{padding:22px 18px;}
    .part .pnote{display:none;}
    .stat-split{grid-template-columns:1fr;gap:10px;}
    .stat-arrow{transform:rotate(90deg);height:0;}
    .stat-side .ss-item{min-width:45%;}
  }
  @media print{
    body{background:#fff;}
    .fab{display:none;}
    .content{padding:0;max-width:none;}
    section,.hero,details.sec{box-shadow:none;border:1px solid var(--line);}
  }
  /* ===== 深色模式（跟随系统）===== */
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e8ecf5; --sub:#9aa3b5; --line:#2a3242; --bg:#11151d; --card:#1a2130;
      --blue-soft:#1c2b45; --green-soft:#12301f; --orange-soft:#33270f;
      --gray-soft:#20242c; --red-soft:#331a19;
    }
    body{background:var(--bg);}
    .pic-card,.p1-rules,.pcard,.dist-card{background:var(--card);color:var(--ink);}
    details.sub{background:var(--bg);}
    details.sub > summary{color:var(--ink);}
    details.sec > summary:hover{background:#1a2230;}
    input[type=number],input[type=text]{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important;}
    .btn,.ffc-btn{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important;}
    .qbar{background:#252d3d;}
    .callout{filter:brightness(.9);}
    .stat-side{background:rgba(255,255,255,.06);}
    footer{color:var(--sub);}
  }
  /* ===== 手机：表格粘性首列 + 最小宽 ===== */
  @media (max-width:700px){
    .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tbl-wrap table{min-width:620px;}
    .tbl-wrap th:first-child,.tbl-wrap td:first-child{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line);}
    body.app-mode .fab{display:none!important;}
  }
  body.app-mode .fab{display:none!important;}
  /* ===== 逐月表卡片化（<640px 自动切换）===== */
  .cards12{display:grid;gap:10px;}
  .card12{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);}
  .c12h{font-weight:800;margin-bottom:6px;font-size:14px;}
  .c12g{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:6px;}
  .c12i{display:flex;justify-content:space-between;font-size:12.5px;}
  .c12i span{color:var(--sub);}
  .c12e{font-size:12.5px;border-top:1px dashed var(--line);padding-top:6px;}

<script>
/* =====================================================================
   渲染器 —— 只认 DATA，不含具体数字。
   ===================================================================== */
const $ = (id) => document.getElementById(id);
let INC = null;   /* 当前生效的收入口径状态（供 Hero 发送按钮使用） */
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
const fmt = n => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ---- Hero ---- */
function renderHero(){
  const m = DATA.meta, box = $("heroBox");
  box.innerHTML = "";
  box.appendChild(el("h1", "", m.title));
  box.appendChild(el("p", "sub", m.subtitle));
  const chips = el("div", "chips");
  chips.appendChild(el("div", "chip dim", `${m.statsDim.label} <b>${m.statsDim.text}</b>`));
  box.appendChild(chips);
  const split = el("div", "stat-split");
  [["now", "stat-side now"], ["exp", "stat-side exp"]].forEach(([key, cls]) => {
    const side = DATA.hero[key], card = el("div", cls);
    card.appendChild(el("div", "ss-head", side.head));
    const items = el("div", "ss-items");
    side.items.forEach(it => {
      const it2 = el("div", "ss-item");
      it2.appendChild(el("span", "", it.label)); it2.appendChild(el("b", "", it.b));
      items.appendChild(it2);
    });
    card.appendChild(items); split.appendChild(card);
    if (key === "now") split.appendChild(el("div", "stat-arrow", "➜"));
  });
  box.appendChild(split);
  if (m.calculator){
    const wrap = el("div", "");
    wrap.style.cssText = "margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;";
    const btn = el("button", "ffc-btn", m.calculator.btn);
    btn.title = m.calculator.tip || "";
    btn.addEventListener("click", () => {
      /* 持仓映射：把「现在」分布卡按关键词归入组合体检的六个桶 */
      const p = { monthlyExpense: parseFloat(m.calculator.fields.spend) || 0 };
      (DATA.overview.now.rows || []).forEach(r => {
        if (r.muted) return;
        const v = parseFloat(String(r.amt).replace(/[≈,]/g, "")) || 0;
        const n = r.name || "";
        if (/基金/.test(n)) p.equity = (p.equity || 0) + v;
        else if (/ESOP|虚拟股/.test(n)) p.esop = (p.esop || 0) + v;
        else if (/银行|活期|现金|安全垫/.test(n)) p.cash = (p.cash || 0) + v;
        else if (/公积金|限用途/.test(n)) p.restricted = (p.restricted || 0) + v;
        else if (/固定资产|车/.test(n)) p.consumer = (p.consumer || 0) + v;
      });
      try { localStorage.setItem("FFC_PREFILL", JSON.stringify({ ts: Date.now(), label: m.calculator.label, fields: m.calculator.fields, portfolio: p, income: window.__INCOME || null })); } catch(e){}
      if (window.parent !== window) {
        try { window.parent.postMessage({ ffSwitch: "calculator" }, "*"); } catch(e){}
      } else {
        window.open(m.calculator.file, "_blank");
      }
    });
    wrap.appendChild(btn);
    wrap.appendChild(el("span", "ffc-tip", m.calculator.tip || ""));
    box.appendChild(wrap);
  }
}

/* ---- 使用说明 ---- */
function renderGuide(){

  tip.style.cssText = "margin:12px 0 0;font-size:12.5px;color:var(--sub);";
  body.appendChild(tip);
  d.appendChild(body); box.appendChild(d);
}

/* ---- 置顶总览 ---- */
function distCard(key, cls){
  const d = DATA.overview[key], card = el("div", "dist-card " + cls);
  card.appendChild(el("div", "dc-head", d.head));
  card.appendChild(el("div", "dc-total", d.total + ' <span style="font-size:12px;font-weight:400;color:var(--sub);">' + d.sub + "</span>"));
  const stack = el("div", "dstack");
  d.stack.forEach(s => {
    const seg = el("div", "", s.label || "");
    seg.style.width = s.w + "%";
    seg.style.background = s.color;
    stack.appendChild(seg);
  });
  card.appendChild(stack);
  d.rows.forEach(r => {
    const row = el("div", "drow"), nm = el("div", "nm");
    if (r.c) { const dot = el("span", "dot", ""); dot.style.background = r.c; nm.appendChild(dot); }
    nm.appendChild(document.createTextNode(r.name));
    if (r.muted) nm.classList.add("muted");
    row.appendChild(nm);
    row.appendChild(el("div", "amt" + (r.neg ? " neg" : ""), r.amt));
    row.appendChild(el("div", "pc2", r.pc));
    card.appendChild(row);
  });
  if (d.callout) { const c = el("div", "callout ok", d.callout); c.style.marginTop = "12px"; card.appendChild(c); }
  return card;
}

  const body = el("div", "sub-body");
  const tbl = el("div", "tbl-wrap"), table = el("table");
  table.innerHTML = '<thead><tr><th>项目</th><th class="num">现在</th><th></th><th class="num">预期</th><th>说明（箭头关系）</th></tr></thead>';
  const tb = el("tbody");
  o.tableRows.forEach(r => {
    const tr = el("tr", r.total ? "total" : "");
    const tagStyle = r.tagStyle ? ` style="${r.tagStyle}"` : "";
    const tag = r.tagCls ? `<span class="tag ${r.tagCls}">${r.tag}</span>` : `<span class="tag"${tagStyle}>${r.tag}</span>`;
    tr.innerHTML = `<td>${tag}</td><td class="num">${r.now}</td><td class="arw">➜</td><td class="num">${r.exp}</td><td>${r.note}</td>`;
    tb.appendChild(tr);
  });
  table.appendChild(tb); tbl.appendChild(table); body.appendChild(tbl);
  body.appendChild(el("div", "callout warn", o.readout));
  det.appendChild(body); sec.appendChild(det);
  box.appendChild(sec);
}

/* ---- 通用 block 渲染 ---- */
function renderBlocks(container, blocks){
  blocks.forEach(b => {
    switch (b.t) {
      case "sub": container.appendChild(el("p", "sec-sub", b.html)); break;
      case "h4": container.appendChild(el("h4", "", b.html)); break;
      case "callout": container.appendChild(el("div", "callout" + (b.kind ? " " + b.kind : ""), b.html)); break;
      case "gap": { const g = el("div", "", ""); g.style.height = (b.h || 14) + "px"; container.appendChild(g); break; }
      case "allocbar": { const w = el("div", "allocbar"); b.items.forEach(i => w.appendChild(el("div", i.cls, i.label))); container.appendChild(w); break; }
      case "cards": { const w = el("div", "cards"); b.items.forEach(i => { const c = el("div", "pcard" + (i.total ? " total" : "")); c.appendChild(el("div", "lab", i.lab)); c.appendChild(el("div", "val", i.val)); c.appendChild(el("div", "note", i.note)); w.appendChild(c); }); container.appendChild(w); break; }

/* =====================================================================
   流水导入 —— 本地解析银行流水文本（交行个人客户交易清单格式等），
   自动生成 2.1 / 2.2 / 2.3，结果会话级保存。不上传。
   ===================================================================== */
const LS_KEY = "FRI_TXNS_V1";

/* ---- 银行流水格式注册表：贡献新银行格式 = 在这里加一个 entry（见 docs/IMPORT.md） ---- */
const FORMATS = {
  "bocom-personal": {
    name: "交通银行 · 个人客户交易清单",
    // 行结构：序号 日期 时间 交易类型 C/D 金额 余额 对方账号 户名 摘要…
    re: /^\s*\d+\s+(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2}:\d{2})\s+(\S+)\s+([CD])\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+(\S+)\s+(.*)$/,
    map: (m) => ({ d: m[1], t: m[3], dc: m[4], amt: parseFloat(m[5].replace(/,/g, "")), bal: parseFloat(m[6].replace(/,/g, "")), rest: (m[8] || "").trim() })
  }
};

/* 折行合并：PDF 抽取常把"户名/摘要"拆到下一行——若某行以"序号+日期"开头但不匹配任何
   格式，则把后续非新记录的行拼接进来再试（对复制粘贴路径同样生效） */
function mergeWrappedLines(lines){
  const fmts = Object.keys(FORMATS);
  const startRe = /^\s*\d+\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}/;
  const matched = (ln) => fmts.some(k => FORMATS[k].re.test(ln));
  const out = [];
  for (let i = 0; i < lines.length; i++){
    let ln = lines[i];
    if (startRe.test(ln) && !matched(ln)) {
      let j = i + 1;
      while (!matched(ln) && j < lines.length && !startRe.test(lines[j])) { ln += " " + lines[j]; j++; }
      i = j - 1;
    }
    out.push(ln);
  }
  return out;
}

function parseStmtText(text){
  const fmts = Object.keys(FORMATS);
  const out = [];
  mergeWrappedLines(text.split(/\r?\n/)).forEach(ln => {
    for (const key of fmts) {
      const f = FORMATS[key], m = f.re.exec(ln);
      if (m) { out.push(f.map(m)); return; }
    }
  });
  return out;
}
function classifyTxn(txn, r){
  if (r.skipTypes.some(k => txn.t.includes(k))) return null;
  if (r.employer && !txn.rest.includes(r.employer)) return null;
  if (r.subsidyKeywords.some(k => txn.rest.includes(k))) return "sub";
  if (txn.rest.includes(r.salaryAbstract)) return txn.amt >= r.bonusMin ? "bonus" : "salary";
  return "other";
}
function aggregate(txns, rules){
  const dates = txns.map(t => t.d).sort();
  const dMin = dates[0], dMax = dates[dates.length - 1];
  const m1 = dMin.slice(0, 7).split("-").map(Number), m2 = dMax.slice(0, 7).split("-").map(Number);
  const months = (m2[0] - m1[0]) * 12 + (m2[1] - m1[1]) + 1;
  const byYear = {};
  txns.forEach(t => {
    const y = t.d.slice(0, 4); byYear[y] = byYear[y] || { n: 0, d: 0, c: 0 };
    byYear[y].n++; if (t.dc === "D") byYear[y].d += t.amt; else byYear[y].c += t.amt;
  });
  const emp = { salary: {}, bonus: {}, sub: {}, other: {} };
  txns.forEach(t => {
    const c = classifyTxn(t, rules); if (!c || c === "other") return;
    const y = t.d.slice(0, 4); emp[c][y] = emp[c][y] || [];
    emp[c][y].push(t);
  });
  const quarters = {};
  txns.forEach(t => {
    if (classifyTxn(t, rules) !== "sub") return;
    const y = t.d.slice(0, 4), q = Math.floor((+t.d.slice(5, 7) - 1) / 3) + 1, k = `${y} Q${q}`;
    quarters[k] = quarters[k] || { n: 0, sum: 0, min: Infinity, max: -Infinity };
    quarters[k].n++; quarters[k].sum += t.amt;
    quarters[k].min = Math.min(quarters[k].min, t.amt); quarters[k].max = Math.max(quarters[k].max, t.amt);
  });
  const big = txns.filter(t => t.dc === "D" && t.amt >= rules.bigExpenseMin).sort((a, b) => b.amt - a.amt).slice(0, 20);
  return { dMin, dMax, months, byYear, emp, quarters, big };
}

/* 把流水最后一笔余额同步进 Hero 指标与「现在」分布卡：银行行、总资产、净资产、
   各行占比、堆叠条全部按新总额重建；其余资产不动。返回 {total, delta} 或 null */
function applyBalance(balance){
  if (!isFinite(balance) || balance < 0) return null;
  const fmtB = n => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = s => parseFloat(String(s).replace(/[≈,]/g, "")) || 0;
  const now = DATA.overview && DATA.overview.now;
  const h = DATA.hero && DATA.hero.now;
  if (!now || !h) return null;
  const bankRow = now.rows.find(r => /银行|活期|现金/.test(r.name) && !r.muted);
  const oldBank = bankRow ? num(bankRow.amt) : 0;
  if (bankRow) bankRow.amt = fmtB(balance);
  const assets = now.rows.filter(r => !r.muted && !r.neg);
  const vals = assets.map(r => num(r.amt));
  const total = vals.reduce((a, b) => a + b, 0);
  const liabRow = now.rows.find(r => r.muted && r.neg);
  const liab = liabRow ? Math.abs(num(liabRow.amt)) : 0;
  now.total = "总资产 ≈" + Math.round(total).toLocaleString();
  now.sub = "｜ 净资产 ≈" + Math.round(total - liab).toLocaleString() + (liab ? "（欠款 " + Math.round(liab).toLocaleString() + "）" : "");
  assets.forEach((r, i) => {
    const pct = total ? vals[i] / total * 100 : 0;
    r.pc = pct.toFixed(1) + "%";
  });
  now.stack = assets.map((r, i) => {
    const pct = total ? vals[i] / total * 100 : 0;
    const short = String(r.name).split("（")[0];
    return { w: +pct.toFixed(1), color: r.c, label: pct >= 8 ? short + " " + pct.toFixed(1) + "%" : "" };
  });
  const delta = balance - oldBank;
  h.items.forEach(it => {
    if (it.label === "当期余额") it.b = fmtB(balance);
    else if (/总资产|流动资产/.test(it.label || "")) {
      const approx = String(it.b).startsWith("≈");
      it.b = (approx ? "≈" : "") + Math.round(num(it.b) + delta).toLocaleString();
    }
  });
  (DATA.overview.tableRows || []).forEach(r => {
    if (/银行|活期|现金/.test(r.tag || "")) r.now = fmtB(balance);
    if (r.tag === "总资产") r.now = "≈" + Math.round(total).toLocaleString();
    if (r.tag === "净资产") r.now = "≈" + Math.round(total - liab).toLocaleString();
  });
  return { total, delta };
}

/* 近 12 个月收入（含奖金）：按分类汇总最近一年的 C 类入账，月均 = 总额 / min(12, 实际跨度) */
function computeIncome12m(txns, rules, src){
  if (!txns || !txns.length) return null;
  const cats = txns.filter(t => t.dc === "C")
    .map(t => ({ d: t.d, amt: t.amt, cat: classifyTxn(t, rules) }))
    .filter(x => x.cat === "salary" || x.cat === "bonus" || x.cat === "sub");
  if (!cats.length) return null;
  const dMax = cats.reduce((m, x) => x.d > m ? x.d : m, "");
  const cutoff = (parseInt(dMax.slice(0, 4), 10) - 1) + dMax.slice(4);
  const win = cats.filter(x => x.d > cutoff);
  if (!win.length) return null;
  const sum = c => win.filter(x => x.cat === c).reduce((a, x) => a + x.amt, 0);
  const salary = sum("salary"), bonus = sum("bonus"), subsidy = sum("sub");
  const allDates = txns.reduce((acc, t) => { acc.push(t.d); return acc; }, []);
  const dMin = allDates.reduce((m, x) => x < m ? x : m, "9999");
  const spanM = Math.max(1, Math.min(12, (parseInt(dMax.slice(0, 4), 10) - parseInt(dMin.slice(0, 4), 10)) * 12 + (parseInt(dMax.slice(5, 7), 10) - parseInt(dMin.slice(5, 7), 10)) + 1));
  const total = salary + bonus + subsidy;
  return { window: cutoff + " ~ " + dMax, salary, bonus, subsidy, total, monthlyAvg: total / spanM, span: spanM, src: src || "流水" };
}

/* ---- PDF 文本抽取（按需联网加载 pdf.js，y 坐标分行后逐行拼接） ---- */
let _pdfjsPromise = null;
function loadPdfJs(){
  if (_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise = new Promise((resolve, reject) => {
    const urls = [
      ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
       "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"],
      ["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
       "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"]
    ];
    const tryAt = (i) => {
      if (i >= urls.length) { reject(new Error("解析组件加载失败（需要联网一次）；可改用复制粘贴")); return; }
      const s = document.createElement("script");
      s.src = urls[i][0];
      s.onload = () => {
        try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = urls[i][1]; resolve(window.pdfjsLib); }
        catch (e) { tryAt(i + 1); }
      };
      s.onerror = () => tryAt(i + 1);
      document.head.appendChild(s);
    };
    tryAt(0);
  });
  return _pdfjsPromise;
}
async function extractPdfText(buf){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: buf }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim() !== "");
    items.sort((a, b) => (b.transform[5] - a.transform[5]) || (a.transform[4] - b.transform[4]));
    let cur = null; const lines = [];
    items.forEach(it => {
      const y = it.transform[5], x = it.transform[4];
      if (!cur || Math.abs(cur.y - y) > 3) { cur = { y, parts: [] }; lines.push(cur); }
      cur.parts.push({ x, s: it.str });
    });
    lines.forEach(l => out.push(l.parts.sort((a, b) => a.x - b.x).map(p => p.s).join(" ").replace(/\s+/g, " ").trim()));
  }
  return out.join("\n");
}

/* ===== 计划推演引擎：由参数重算 1.1~1.4 与预期分布 ===== */
function computePlan(p){
  const rows = [];
  let cCum = 0, eCum = 0;
  const sy = parseInt(p.start.slice(0, 4), 10), sm = parseInt(p.start.slice(5, 7), 10);
  for (let m = 0; m < p.months; m++){
    const mi = sm - 1 + m;
    const ym = (sy + Math.floor(mi / 12)) + "-" + String(mi % 12 + 1).padStart(2, "0");
    const cLeft = Math.max(0, p.cushionCap - cCum);
    const cM = Math.min(p.cushion, cLeft);
    const eM = p.esop + (p.cushion - cM);
    cCum += cM; eCum += eM;
    const evs = (p.oneoffOut || []).filter(o => o.m === m);
    let cut = 0; evs.forEach(o => { if (o.pool === "预备") cut += o.amt; });
    eCum = Math.max(0, eCum - cut);
    rows.push({ m, ym, cM, cCum, eM, eCum, invest: p.invest, evs });
  }
  const funds = p.fundsBase + p.invest * p.months;
  const oneoffInTotal = (p.oneoffIn || []).reduce((a, o) => a + o.amt, 0);
  return { rows, funds, cushionFinal: cCum, esopFinal: eCum, liquid: cCum + funds + eCum + p.bankKeep, oneoffInTotal };
}

  return eng;

  });
  resetBtn.addEventListener("click", () => {
    if (!confirm("重置为示例数据？当前载入的数据包与已导入的流水将被清除（不影响你导出的备份文件）。")) return;
    sessionStorage.removeItem(DATA_KEY);
    sessionStorage.removeItem(LS_KEY);
    sessionStorage.removeItem("FRI_SPEND");
    location.reload();
  });
  refreshDataStatus();

  /* ③ 收入口径：优先用本会话流水实时计算，其次数据包，最后计划默认 */
  const incomeFromTxns = () => {
    const st = loadStoredImport();
    if (!st || !st.txns || !st.txns.length) return null;
    return computeIncome12m(st.txns, Object.assign({}, DATA.meta.importer, st.rules), "本会话流水实时计算");
  };
  const getSpend = () => { const v = parseFloat(q("#spendAdj").value); return isFinite(v) && v >= 0 ? v : 0; };
  const refreshIncome = () => {
    INC = incomeFromTxns() || (DATA.income ? Object.assign({ src: "数据包" }, DATA.income) : null);
    const sp = getSpend();
    DATA.meta.calculator.fields.spend = sp;
    if (DATA.income) DATA.income.monthlyExpense = sp;
    try { sessionStorage.setItem("FRI_SPEND", JSON.stringify(sp)); } catch(e){}
    if (INC) {
      q("#incC1").innerHTML = "口径一 · 月均收入（含奖金摊平）：<b>" + fmt(INC.monthlyAvg) + "</b> 元/月" + (INC.window ? "　<span class=\"hint\">" + INC.window + "</span>" : "");
      q("#incC2").innerHTML = "口径二 · 月结余：<b>" + fmt(INC.monthlyAvg - sp) + "</b> 元/月 = 收入 − 每月支出";
      q("#incSrc").textContent = "来源：" + (INC.src || "数据包") + (INC.salary !== undefined ? " ｜ 工资 " + fmt(INC.salary) + " + 年终奖 " + fmt(INC.bonus) + " + 补贴 " + fmt(INC.subsidy) + " = " + fmt(INC.total) + " / 12 个月" : "");
    } else {
      q("#incC1").textContent = "口径一 · 月均收入：—（导入流水或数据包后自动计算）";
      q("#incC2").textContent = "口径二 · 月结余：—";
      q("#incSrc").textContent = "";
    }
    window.__INCOME = INC ? { avg12m: +INC.monthlyAvg.toFixed(2), surplus: +(INC.monthlyAvg - sp).toFixed(2) } : null;
  };
  q("#spendAdj").addEventListener("input", refreshIncome);
  /* 支出默认值：会话内调整过 → 用调整值；否则用数据包/计划默认 */
  (function initSpend(){
    let sp = null;
    try { const raw = sessionStorage.getItem("FRI_SPEND"); if (raw !== null) sp = JSON.parse(raw); } catch(e){}
    if (sp === null || !isFinite(sp) || sp < 0) sp = (DATA.income && isFinite(DATA.income.monthlyExpense)) ? DATA.income.monthlyExpense : m.calculator.fields.spend;
    q("#spendAdj").value = sp;
  })();
  refreshIncome();

  const readRules = () => ({
    employer: q("#impEmployer").value.trim() || imp.employer,
    salaryAbstract: imp.salaryAbstract,
    subsidyKeywords: q("#impSubsidy").value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
    skipTypes: imp.skipTypes,
    bonusMin: parseFloat(q("#impBonus").value) || imp.bonusMin,
    bigExpenseMin: parseFloat(q("#impBig").value) || imp.bigExpenseMin
  });
  const showPreview = (txns, rules) => {
    const ag = aggregate(txns, rules);
    const blocks = buildImportBlocks(ag, rules);
    lastTxns = txns; lastRules = rules;
    q("#impStatus").textContent = `解析出 ${txns.length} 笔（${blocks.span}）`;
    const prev = q("#impPreview");
    prev.innerHTML = "";
    const pv = el("details", "sub");
    pv.appendChild(el("summary", "", "解析预览（将写入 2.1 / 2.2 / 2.3）<span class=\"chev\">▼</span>"));
    const pb = el("div", "sub-body");
    renderBlocks(pb, [...blocks.b21, ...blocks.b22, ...blocks.b23]);
    pv.appendChild(pb); prev.appendChild(pv);
  };
  q("#impParse").addEventListener("click", () => {
    const text = q("#impText").value;
    const txns = parseStmtText(text);
    if (!txns.length) {
      alert("未解析到流水行（0 笔）。\n\n常见原因：\n· 这份 PDF/文本不是「个人客户交易清单」明细格式\n· 复制时只选了表头或汇总页\n\n请确认粘贴的内容里有形如「1 2024-05-15 12:00:00 代发工资 C 15248.00 …」的明细行。");
      q("#impStatus").textContent = "未解析到流水行（0 笔）。";
      return;
    }
    showPreview(txns, readRules());
  });
  file.addEventListener("change", async () => {
    const files = [...(file.files || [])];
    if (!files.length) return;
    const parts = [];
    for (const f of files) {
      if (/\.pdf$/i.test(f.name)) {
        try {
          parts.push(await extractPdfText(await f.arrayBuffer()));
        } catch (e) {
          q("#impStatus").textContent = "PDF 解析失败：" + e.message;
          return;
        }
      } else {
        parts.push(await f.text());
      }
    }
    const text = parts.join("\n");
    q("#impText").value = text;
    const txns = parseStmtText(text);
    if (!txns.length) {
      alert("文件里未解析到流水行（0 笔）。若这是其他银行的流水，欢迎按 docs/IMPORT.md 贡献格式；交行 PDF 请确认包含明细页。");
      q("#impStatus").textContent = "文件里未解析到流水行。";
      return;
    }
    showPreview(txns, readRules());
  });
  q("#impApply").addEventListener("click", () => {
    if (!lastTxns) {
      alert("请先完成两步：\n1. 选择/粘贴流水后点「🔍 解析并预览」\n2. 预览确认无误后再点「✅ 应用到报告」");
      return;
    }
    const res = applyImport(lastTxns, lastRules, true);
    const balMsg = (res.lastBal != null && res.balInfo) ? "\n已同步当期余额：" + res.lastBal.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "（Hero 与分布卡已更新）" : "";
    alert("✅ 已应用到报告：共 " + lastTxns.length.toLocaleString() + " 笔（" + res.ag.dMin + " ~ " + res.ag.dMax + "）" + balMsg + "\n\n已写入并展开：2.1 流水概况 ｜ 2.2 收入结构 ｜ 2.3 大额支出\n页面已定位到 2.1，Hero 的「统计维度」也同步更新。");
  });
  q("#impClear").addEventListener("click", () => {
    sessionStorage.removeItem(LS_KEY);
    q("#impStatus").textContent = "已清除本次解析的流水（关闭标签页同样会自动清空）。";
    q("#impPreview").innerHTML = "";
  });
  return d;
}

/* ===== ④ 计划参数面板 ===== */
const DEFAULT_PLAN = {
  start: "2026-11", months: 8, income: 21000, spend: 6000,
  invest: 4000, cushion: 3000, cushionCap: 24000, esop: 5000,
  fundsBase: 30000, bankKeep: 6000, depreciation: 10000,
  oneoffIn: [], oneoffOut: []
};
function buildPlanPanel(){
  const d = el("details", "sec"); d.id = "sec-plan"; d.open = true;
  d.appendChild(el("summary", "", "📋 计划参数推演（改参数 → 第一部分与预期分布自动重算）<span class=\"chev\">▼</span>"));
  const body = el("div", "sec-body");
  const p = Object.assign({}, DEFAULT_PLAN, DATA.plan || {});
  body.appendChild(el("p", "sec-sub", '改下面任意参数，<b>第一部分（1.1~1.4）</b>与置顶「预期」分布会<b>自动重算</b>；一次性收支可增删。参数仅存当前标签页会话。「每月支出」在 ③ 收入口径处调整，两处联动。'));

  const grid = el("div", "");
  grid.style.cssText = "display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;";
  const field = (label, id, val, extra) => {
    const dv = el("div", "");
    dv.appendChild(el("label", "", label)).style.cssText = "display:block;font-size:12px;color:var(--sub);margin-bottom:3px;";
    const inp = el("input", "", ""); inp.id = id; inp.type = "number"; inp.value = val;
    if (extra) { inp.min = extra.min; inp.max = extra.max; inp.step = extra.step; }
    inp.style.cssText = "width:110px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13.5px;text-align:right;background:#fff;";
    dv.appendChild(inp); return dv;
  };
  const textField = (label, id, val, w) => {
    const dv = el("div", "");
    dv.appendChild(el("label", "", label)).style.cssText = "display:block;font-size:12px;color:var(--sub);margin-bottom:3px;";
    const inp = el("input", "", ""); inp.id = id; inp.type = "text"; inp.value = val;
    inp.style.cssText = "width:" + (w || 90) + "px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13.5px;background:#fff;";
    dv.appendChild(inp); return dv;
  };
  grid.appendChild(textField("起始月（YYYY-MM）", "pfStart", p.start, 90));
  grid.appendChild(field("计划月数", "pfMonths", p.months, { min: 1, max: 36 }));
  grid.appendChild(field("计划月收入", "pfIncome", p.income, { min: 0, step: 500 }));
  grid.appendChild(field("每月定投", "pfInvest", p.invest, { min: 0, step: 500 }));
  grid.appendChild(field("每月安全垫", "pfCushion", p.cushion, { min: 0, step: 500 }));
  grid.appendChild(field("安全垫上限", "pfCap", p.cushionCap, { min: 0, step: 1000 }));
  grid.appendChild(field("每月 ESOP 预备", "pfEsop", p.esop, { min: 0, step: 500 }));
  grid.appendChild(field("基金存量", "pfFunds", p.fundsBase, { min: 0, step: 1000 }));
  grid.appendChild(field("期末银行常备", "pfBank", p.bankKeep, { min: 0, step: 500 }));
  grid.appendChild(field("期间折旧", "pfDep", p.depreciation, { min: 0, step: 1000 }));
  body.appendChild(grid);
  const spendLine = el("div", "", "");
  spendLine.style.cssText = "font-size:12.5px;color:var(--sub);margin:6px 0;";
  body.appendChild(spendLine);

  /* 一次性收支编辑 */
  const oneoffBox = el("div", "");
  oneoffBox.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;";
  let TEMP_IN = (p.oneoffIn || []).slice();
  let TEMP_OUT = (p.oneoffOut || []).slice();
  const renderOneoff = () => {
    oneoffBox.innerHTML = "";
    [["收入（不计入基本盘）", "in", TEMP_IN], ["支出", "out", TEMP_OUT]].forEach(([tt, kind, arr]) => {
      const dv = el("div", "");
      dv.appendChild(el("h4", "", "一次性" + tt + ' <span class="hint">' + arr.length + ' 项</span>'));
      const lst = el("div", "");
      arr.forEach((o, i) => {
        const row = el("div", "");
        row.style.cssText = "display:flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 0;";
        row.innerHTML = '<span class="tag ' + (kind === "in" ? "tag-blue" : "tag-red") + '">第 ' + (o.m + 1) + ' 月</span> ' +
          o.label + ' <b>' + (kind === "in" ? "+" : "") + fmt(o.amt) + '</b> 元' + (kind === "out" && o.pool === "预备" ? '（预备扣）' : '');
        const del = el("button", "", "删");
        del.style.cssText = "margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:11px;padding:1px 7px;color:var(--red);";
        del.addEventListener("click", () => { arr.splice(i, 1); renderOneoff(); applyAll(); });
        row.appendChild(del); lst.appendChild(row);
      });
      if (!arr.length) lst.appendChild(el("div", "", '<span class="hint">暂无</span>'));
      dv.appendChild(lst);
      /* 添加行 */
      const ar = el("div", "");
      ar.style.cssText = "display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap;";
      const mi = el("input", "", ""); mi.type = "number"; mi.placeholder = "月序"; mi.min = 0;
      mi.style.cssText = "width:56px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;text-align:right;";
      const lb = el("input", "", ""); lb.type = "text"; lb.placeholder = "名称";
      lb.style.cssText = "width:110px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;";
      const am = el("input", "", ""); am.type = "number"; am.placeholder = "金额"; am.min = 0;
      am.style.cssText = "width:90px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;text-align:right;";
      const add = el("button", "", "+ 添加");
      add.style.cssText = "border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;padding:3px 10px;";
      add.addEventListener("click", () => {
        const mI = parseInt(mi.value), aI = parseFloat(am.value);
        if (!isFinite(mI) || !lb.value || !isFinite(aI)) return;
        const item = { m: Math.max(0, mI - 1), label: lb.value, amt: aI };
        if (kind === "out") item.pool = "预备";
        arr.push(item); mi.value = ""; lb.value = ""; am.value = "";
        renderOneoff(); applyAll();
      });
      ar.appendChild(mi); ar.appendChild(lb); ar.appendChild(am); ar.appendChild(add);
      dv.appendChild(ar);
      oneoffBox.appendChild(dv);
    });
  };

  body.appendChild(el("h4", "", "一次性收支（增删后自动重算）"));
  body.appendChild(oneoffBox);

  const btns = el("div", "");
  btns.style.cssText = "display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap;";
  const applyBtn = el("button", "ffc-btn primary", "🔄 按参数重算计划");
  applyBtn.style.cssText = "background:var(--blue);color:#fff;border:none;";
  const resetBtn2 = el("button", "btn", "↺ 恢复模板默认");
  btns.appendChild(applyBtn); btns.appendChild(resetBtn2);
  const planStatus = el("span", "", ""); planStatus.id = "planStatus";
  planStatus.style.cssText = "font-size:12.5px;color:var(--sub);";
  btns.appendChild(planStatus);
  body.appendChild(btns);

  d.appendChild(body);  /* 先入树，再绑事件 */

  /* 交互 */
  const q = (sel) => d.querySelector(sel);
  const rp = (id) => { const v = parseFloat(q("#" + id).value); return isFinite(v) ? v : 0; };
  const readParams = () => Object.assign({}, DEFAULT_PLAN, {
    start: q("#pfStart").value.trim() || DEFAULT_PLAN.start,
    months: Math.max(1, Math.min(36, rp("pfMonths")) || 8),
    income: rp("pfIncome"),
    spend: (DATA.meta.calculator && DATA.meta.calculator.fields.spend) || DEFAULT_PLAN.spend,
    invest: rp("pfInvest"), cushion: rp("pfCushion"), cushionCap: rp("pfCap"),
    esop: rp("pfEsop"), fundsBase: rp("pfFunds"), bankKeep: rp("pfBank"), depreciation: rp("pfDep"),
    oneoffIn: TEMP_IN, oneoffOut: TEMP_OUT
  });
  const applyAll = () => { applyPlan(readParams(), true); };
  applyBtn.addEventListener("click", applyAll);
  resetBtn2.addEventListener("click", () => {
    if (!confirm("恢复模板默认参数？当前推演结果会被覆盖。")) return;
    sessionStorage.removeItem("FRI_PLAN");
    const fresh = Object.assign({}, DEFAULT_PLAN, DATA.plan || {});
    Object.keys(DATA.plan || {}).forEach(k => delete DATA.plan[k]);
    Object.assign(DATA.plan, fresh);
    location.reload();
  });
  /* 每月支出与 ③ 联动显示 */
  const syncSpendLine = () => { spendLine.textContent = "每月支出：" + ((DATA.meta.calculator && DATA.meta.calculator.fields.spend) || DEFAULT_PLAN.spend) + " 元（在 ③ 收入口径处调整）"; };
  syncSpendLine();
  renderOneoff();
  return d;
}

/* ---- footer + 启动 ---- */
function renderFoot(){ $("footBox").textContent = DATA.meta.footer; }
function bindInteractions(){
  const fabLinks = Array.from(document.querySelectorAll('.fab a[data-part]'));
  fabLinks.forEach(a => {
    a.addEventListener('click', () => {
      const block = document.getElementById(a.dataset.part);
      if (block) block.querySelectorAll('details.sec').forEach(x => x.open = true);
    });
  });
  const spy = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) fabLinks.forEach(l => l.classList.toggle('active', l.dataset.part === e.target.id));
    });
  }, { rootMargin: '-30% 0px -55% 0px' });
  document.querySelectorAll('.pblock').forEach(b => spy.observe(b));
}
function boot(){
  if (location.search.indexOf("app=1") >= 0) document.body.classList.add("app-mode");
  renderHero(); renderGuide(); renderOverview(); renderParts(); renderFoot(); bindInteractions();
  cardify12();
  window.__chijiaReady = true;   /* APP 壳据此判断 iframe 已就绪，可接收指令 */
}
/* 首页（APP 壳）指令：打开指定面板 */
window.addEventListener("message", e => {
  if (!e.data || e.data.ffOpen !== "import" && e.data.ffOpen !== "plan" && e.data.ffOpen !== "income" && e.data.ffOpen !== "guide") return;
  const map = { import: "sec-import", plan: "sec-plan", income: "sec-import", guide: "sec-guide" };
  const sec = document.getElementById(map[e.data.ffOpen]);
  if (!sec) return;
  sec.open = true; sec.scrollIntoView({ behavior: "smooth", block: "start" });
  if (e.data.ffOpen === "income") {
    const sp = document.getElementById("spendAdj");
    if (sp) { sp.scrollIntoView({ behavior: "smooth", block: "center" }); sp.focus(); }
  }
});
/* 窄屏：逐月执行表切换为「每月一卡」 */
function cardify12(){
  const wrap = document.querySelector("#sec-1-2 .tbl-wrap");
  if (!wrap) return;
  const table = wrap.querySelector("table");
  const host = wrap.parentElement;
  let cards = host.querySelector(".cards12");
  const narrow = window.innerWidth < 640;
  if (narrow && !cards){
    const head = [...table.querySelectorAll("thead th")].map(x => x.textContent.trim());
    cards = el("div", "cards12");
    [...table.querySelectorAll("tbody tr")].forEach(tr => {
      const c = tr.cells;
      const card = el("div", "card12");
      card.innerHTML = '<div class="c12h">' + c[0].textContent + '</div>' +
        '<div class="c12g">' + [1, 2, 3, 4, 5].map(i => '<div class="c12i"><span>' + (head[i] || "") + '</span><b>' + c[i].textContent + '</b></div>').join("") + '</div>' +
        '<div class="c12e">' + c[6].innerHTML + '</div>';
      cards.appendChild(card);
    });
    host.appendChild(cards);
    table.style.display = "none";
  } else if (!narrow && cards){
    cards.remove(); table.style.display = "";
  }
}
window.addEventListener("resize", cardify12);
/* 若本标签页会话中载入过数据包（导入的 JSON），启动时覆盖示例数据；
   数据一律会话级（sessionStorage）——关闭浏览器即回到示例，磁盘不留痕迹 */
(function restoreSavedData(){
  try {
    /* 旧版本曾存 localStorage，迁移期清理 */
    localStorage.removeItem("FRI_DATA_V1");
    localStorage.removeItem("FRI_TXNS_V1");
    const raw = sessionStorage.getItem("FRI_DATA_V1");
    if (!raw) return;
    const obj = JSON.parse(raw);
    if (obj && obj.data && obj.data.meta && Array.isArray(obj.data.parts)) Object.assign(DATA, obj.data);
  } catch(e){}
})();
boot();
/* 若本地存有上次导入的流水，恢复之（在 boot 之外仅执行一次，避免递归） */
(function(){
  const stored = loadStoredImport();
  if (stored) applyImport(stored.txns, Object.assign({}, DATA.meta.importer, stored.rules), false);
})();
/* 恢复上次推演的计划参数（会话级） */
(function(){
  try {
    const raw = sessionStorage.getItem("FRI_PLAN");
    if (!raw) return;
    const p = JSON.parse(raw);
    if (p && p.months) applyPlan(p, false);
  } catch(e){}
})();
window.addEventListener('beforeprint', () => document.querySelectorAll('details.sec, details.sub').forEach(x => x.open = true));
</script>
