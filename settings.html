<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>设置 · 数据与流水导入 — 持家 chijia</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;display:flex;flex-direction:column;height:100%;background:#f4f6fa;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overscroll-behavior:none;}
  @media (prefers-color-scheme: dark){ body{background:#11151d;} }
  header.top{
    flex:none;display:flex;align-items:center;gap:10px;
    background:linear-gradient(135deg,#22315c 0%,#2f6fed 100%);
    color:#fff;padding:9px 14px;
  }
  header.top .logo{font-weight:800;font-size:14px;letter-spacing:1px;}
  header.top .sub{font-size:11px;opacity:.8;}
  header.top .spacer{flex:1;}
  header.top .lock{font-size:11px;opacity:.75;}
  .frame{flex:1;position:relative;overflow:hidden;background:#f4f6fa;}
  @media (prefers-color-scheme: dark){ .frame{background:#11151d;} }
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;}
</style>
</head>
<body>
<header class="top">
  <span class="logo">⚙️ 设置</span>
  <span class="sub">数据与流水导入 / 备份 / 收入口径</span>
  <span class="spacer"></span>
  <span class="lock">🔒 本地处理，不上传</span>
</header>
<div class="frame">
  <iframe src="./report.html?view=settings&app=1" title="设置面板"></iframe>
</div>
</body>
</html>
